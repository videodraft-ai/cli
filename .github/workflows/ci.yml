# CI for the public videodraft-ai/cli repo. Copy to .github/workflows/ci.yml
# during extraction (workflows are kept under release/ in the monorepo so the
# private repo's CI doesn't try to run them).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC: re-runs every check on main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the built binary
        run: node dist/index.js --version && node dist/index.js --help
      - name: E2E against mock MCP server
        run: node test/e2e-mock.mjs

  bun-client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: videodraft/client must run under Bun (macOS app sidecar contract)
        # Written in the checkout root so the relative import resolves to
        # ./dist/client.js (not /tmp/dist/...). .mjs = plain ESM, no TS types.
        run: |
          cat > bun-client-check.mjs <<'EOF'
          import { VideoDraftClient, staticTokenProvider } from "./dist/client.js";
          const c = new VideoDraftClient({ baseUrl: "https://x.test", tokenProvider: staticTokenProvider("vd_mcp_x"),
            fetchImpl: (async () => new Response(JSON.stringify({ jsonrpc: "2.0", id: 1, result: { content: [{ type: "text", text: "{\"ok\":true}" }], isError: false } }))) });
          const r = await c.callTool("whoami");
          if (!r.ok) throw new Error("client check failed");
          console.log("bun client check ok");
          EOF
          bun run bun-client-check.mjs

  skills-checks:
    # Plugin-manifest version sync + skills/index.json freshness. Single OS on
    # purpose: these are file-content checks, and index.json embeds byte hashes,
    # so run on Linux (LF checkout) to keep those hashes stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm check:index

  compiled-skill-check:
    # The macOS app ships the CLI as a `bun build --compile` single-file binary.
    # Guard that the skill stays EMBEDDED and is served/installed with no on-disk
    # skills/ dir — the exact failure the __SKILL_ASSETS__ define fixes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Compiled binary serves + installs the embedded skill (no skills/ on disk)
        run: |
          bun build dist/index.js --compile --outfile "$RUNNER_TEMP/vd"
          "$RUNNER_TEMP/vd" skills show --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s);if(o.section!=="SKILL.md"||!o.content.includes("Showing media"))throw new Error("compiled skills show broken");console.log("compiled skills show ok")})'
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/vd" skills install --agent claude --force --json > /dev/null
          test -f "$RUNNER_TEMP/home/.claude/skills/videodraft/SKILL.md" && echo "compiled skills install ok"
